name: CI

on:
  pull_request:
  push:
    branches: [main, chore/v0.1.0-foundation]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studepartment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studepartment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEPLOYMENT_ENV: ci
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studepartment?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      BETTER_AUTH_URL: http://127.0.0.1:3000
      AUTH_IP_HEADER: x-forwarded-for
      RELEASE_SHA: ${{ github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile
      - name: Validate environment contract
        run: pnpm env:check
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Validate migrations on fresh PostgreSQL
        run: pnpm db:migrate:deploy
      - name: Confirm migration status
        run: pnpm db:migrate:status
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: Production runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE=/tmp/studepartment-next.log
          pnpm --filter @studepartment/web start >"$LOG_FILE" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" >/dev/null 2>&1 || true
            wait "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat "$LOG_FILE"
            exit 1
          fi

          pnpm smoke:runtime
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
