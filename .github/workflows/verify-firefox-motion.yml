name: Check opportunities drag in Firefox
on:
  push:
    branches: [codex/verify-firefox-motion]
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Firefox test browser
        run: |
          npm install --no-audit --no-fund playwright@1.64.0
          npx playwright install --with-deps firefox
      - name: Verify pause, dragging in both directions and resume
        run: |
          node <<'JS'
          const assert=require("node:assert/strict");
          const { firefox } = require("playwright");
          const origin = "https://provenant-web.onrender.com/start?step=browse";
          const scrollSelector="[data-manual]";
          async function exercise(browser, name){
            const page=await browser.newPage({viewport:{width:1280,height:860},reducedMotion:"no-preference"});
            page.setDefaultTimeout(13000);
            try{
              await page.goto(origin);
              const desk=page.getByRole("complementary",{name:"Latest position and grant preview"});
              const rail=desk.locator(scrollSelector);
              const pause=desk.getByRole("button",{name:"Pause opportunity motion"});
              await rail.waitFor(); await pause.waitFor();
              await page.mouse.move(2,2);
              const position=()=>rail.evaluate(e=>e.scrollLeft);
              await page.waitForFunction(s=>document.querySelector(s)?.scrollLeft>32,scrollSelector);
              const beforePause=await position();
              await pause.click();
              const paused=await position();
              assert.ok(paused>=beforePause-2 && paused<beforePause+30,{beforePause,paused});
              const resume=desk.getByRole("button",{name:"Resume opportunity motion"});
              await resume.waitFor();
              await page.waitForTimeout(130);
              assert.equal(await position(),paused);
              const box=await rail.boundingBox();
              async function dragBy(delta){
                const x=box.x+box.width*.50, y=box.y+41;
                await page.mouse.move(x,y);
                await page.mouse.down();
                await page.mouse.move(x+delta,y,{steps:9});
                await page.mouse.up();
              }
              await dragBy(-310);
              const dragged=await position();
              assert.ok(dragged-paused>285,{paused,dragged});
              assert.equal(await desk.getByRole("region",{name:"Selected opportunity"}).count(),0);
              await dragBy(170);
              const returned=await position();
              assert.ok(dragged-returned>150,{dragged,returned});
              assert.equal(await desk.getByRole("region",{name:"Selected opportunity"}).count(),0);
              await page.mouse.click(box.x+box.width*.35,box.y+40);
              await desk.getByRole("region",{name:"Selected opportunity"}).waitFor();
              await desk.getByRole("button",{name:"Close opportunity details"}).click();
              await resume.click(); await page.mouse.move(2,2);
              await page.waitForFunction(({selector,returned})=>document.querySelector(selector)?.scrollLeft>returned+15,{selector:scrollSelector,returned});
              console.log({browser:name,version:browser.version(),paused,dragged,returned,clickedDetail:true,resumed:true});
            }finally{await page.close()}
          }
          (async()=>{
            const browser=await firefox.launch();
            try {
              const check=await browser.newPage();
              let ready=false;
              for (let attempt=0;attempt<35;attempt++) {
                try{
                  await check.goto(origin,{waitUntil:"domcontentloaded",timeout:15000});
                  ready=await check.locator(scrollSelector).count()>0;
                }catch{}
                if(ready)break;
                await new Promise(resolve=>setTimeout(resolve,10000));
              }
              assert.ok(ready,"Draggable ticker is live");
              await check.close();
              await exercise(browser,"Firefox");
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
