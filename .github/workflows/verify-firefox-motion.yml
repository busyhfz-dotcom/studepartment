name: Check mRNA entrance motion in Firefox
on:
  push:
    branches: [codex/verify-firefox-motion]
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Firefox test browser
        run: |
          npm install --no-audit --no-fund playwright@1.64.0
          npx playwright install --with-deps firefox
      - name: Verify the entrance layer on desktop and mobile
        run: |
          node <<'JS'
          const assert = require("node:assert/strict");
          const { firefox } = require("playwright");
          const url="https://provenant-web.onrender.com/start";
          async function signature(page) {
            return page.locator("canvas[data-transcript]").evaluate(c=>{
              const narrow=c.clientWidth<=700;
              const x=Math.round(c.width*(narrow?.018:.028)), y=Math.round(c.height*.42);
              const w=Math.round(c.width*(narrow?.13:.16)),h=Math.round(c.height*.44);
              const data=c.getContext("2d").getImageData(x,y,w,h).data;
              let hash=0, visible=0;for(let i=3;i<data.length;i+=4){hash=Math.imul(hash,31)+data[i]|0;visible+=data[i]>5?1:0;}
              return {hash,visible};
            });
          }
          async function exercise(engine,name,options,sizes) {
            const browser=await engine.launch(options);
            try{
              for(const [width,height] of sizes) {
                const page=await browser.newPage({viewport:{width,height},reducedMotion:"reduce"});
                await page.goto(url);
                const canvas=page.locator("canvas[data-transcript]");
                await canvas.waitFor();
                await page.waitForFunction(()=>document.querySelector("canvas[data-transcript]")?.width>300);
                const first=await signature(page);
                assert.ok(first.visible>45);
                const heading=page.getByRole("heading",{name:"Research careers & funding"});
                assert.ok(await heading.evaluate(e=>{
                  const rect=e.getBoundingClientRect();
                  return e.contains(document.elementFromPoint(rect.x+rect.width/2,rect.y+rect.height/2));
                }));
                await page.waitForTimeout(425);
                assert.equal((await signature(page)).hash,first.hash);
          
                await page.getByRole("button",{name:"Play background motion"}).click();
                await page.waitForTimeout(850);
                const after=await signature(page);
                assert.notEqual(after.hash,first.hash);
                await page.getByRole("button",{name:"Pause background motion"}).click();
                const stopped=await signature(page);
                await page.waitForTimeout(425);
                assert.equal((await signature(page)).hash,stopped.hash);
                await page.getByRole("link",{name:/Find grant & position/}).click();
                await page.getByRole("complementary",{name:"Latest position and grant preview"}).waitFor();
                assert.equal(await canvas.count(),0);
                console.log({browser:name,width,visibleSamples:first.visible,motion:true,pause:true,entryOnly:true});
                await page.close();
              }
            }finally{await browser.close()}
          }
          (async()=>{
            const probe=await firefox.launch();
            let ready=false;
            try {
              const page=await probe.newPage();
              for(let attempt=0;attempt<40;attempt++){
                try {
                  await page.goto(url,{waitUntil:"domcontentloaded",timeout:15000});
                  ready=await page.locator("canvas[data-transcript]").count()>0;
                }catch{}
                if(ready)break;
                await new Promise(resolve=>setTimeout(resolve,10000));
              }
            }finally{await probe.close();}
            assert.ok(ready,"The new mRNA layer is live");
            await exercise(firefox,"Firefox",{headless:true},[[1440,900],[390,844]]);
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
