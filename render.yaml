services:
  - type: web
    name: provenant-web
    runtime: docker
    plan: free
    region: frankfurt
    branch: codex/provenant-render-migration
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: "off"
    healthCheckPath: /api/health/live
    dockerCommand: /app/scripts/start-web-container.sh
    envVars:
      - key: PORT
        value: "3000"
      - key: DEPLOYMENT_ENV
        value: staging
      # Render sits behind Cloudflare, which overwrites CF-Connecting-IP with the real client
      # address. X-Forwarded-For can carry values the client sent, so it is only the fallback.
      - key: AUTH_IP_HEADER
        value: cf-connecting-ip,x-forwarded-for
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FILE_STORAGE_ENDPOINT
        sync: false
      - key: FILE_STORAGE_BUCKET
        value: provenant-files
      - key: FILE_STORAGE_REGION
        value: eu-central-1
      - key: FILE_STORAGE_FORCE_PATH_STYLE
        value: "true"
      - key: FILE_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: FILE_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OPPORTUNITY_SYNC
        value: "off"
      - key: OPPORTUNITY_INGEST_TOKEN
        generateValue: true
