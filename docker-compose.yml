services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studepartment
      POSTGRES_PASSWORD: studepartment
      POSTGRES_DB: studepartment
    ports:
      - "5432:5432"
    volumes:
      - studepartment_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studepartment -d studepartment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studepartment_postgres:
